components:
  schemas:
    Customer:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        user_uuid:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        doc:
          type: string
          maxLength: 11
        address:
          type: string
          maxLength: 250
        address_number:
          type: string
          nullable: true
          maxLength: 10
        address_line_2:
          type: string
          nullable: true
          maxLength: 250
        neighborhood:
          type: string
          maxLength: 250
        city:
          type: string
          maxLength: 250
        state:
          type: string
          maxLength: 2
        country:
          type: string
          maxLength: 3
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - city
      - country
      - created_at
      - doc
      - first_name
      - last_name
      - neighborhood
      - state
      - updated_at
      - user_uuid
      - uuid
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: number
          format: double
      required:
      - status
      - timestamp
      - uptime_seconds
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedStaffList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
